<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>朋友對我的動態留言板 💌</title>

  <!-- Google Fonts 可愛字型 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    /* ==========================================
       1. 全域變數與基礎設定 (可愛粉嫩風格)
       ========================================== */
    :root {
      --bg-color: #FFF5F7;
      --primary-color: #FFB7B2;
      --accent-color: #FF85A1;
      --card-bg: #FFFFFF;
      --text-main: #5A4A42;
      --text-muted: #A3938B;
      --shadow: 0 8px 20px rgba(255, 183, 178, 0.3);
      --font-family: 'Zen Maru Gothic', sans-serif, system-ui;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      font-family: var(--font-family);
      color: var(--text-main);
      min-height: 100vh;
      padding: 2rem 1rem;
      background-image: radial-gradient(#FFDAC1 1.5px, transparent 1.5px);
      background-size: 24px 24px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ==========================================
       2. 標題與檔頭設計
       ========================================== */
    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--accent-color);
      text-shadow: 2px 2px 0px #FFF;
      display: inline-block;
      position: relative;
    }

    h1::before, h1::after {
      content: '✨';
      margin: 0 8px;
    }

    .subtitle {
      font-size: 1rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
      font-weight: 700;
    }

    /* ==========================================
       3. 酷炫可愛載入動畫 (Loading Animation)
       ========================================== */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 1rem;
    }

    .loader-icon {
      font-size: 3.5rem;
      animation: heartBeat 1.2s infinite ease-in-out;
      margin-bottom: 1rem;
    }

    .loading-text {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--accent-color);
      letter-spacing: 2px;
      animation: pulse 1.5s infinite;
    }

    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3) rotate(5deg); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* ==========================================
       4. CSS 瀑布流排版 (Masonry Layout)
       ========================================== */
    .masonry-grid {
      column-count: 1;
      column-gap: 1.5rem;
      display: none; /* 載入完成後透過 JS 顯示 */
    }

    /* 響應式欄數調整 */
    @media (min-width: 600px) {
      .masonry-grid { column-count: 2; }
    }
    @media (min-width: 900px) {
      .masonry-grid { column-count: 3; }
    }
    @media (min-width: 1200px) {
      .masonry-grid { column-count: 4; }
    }

    /* ==========================================
       5. 卡片樣式 (Message Card)
       ========================================== */
    .card {
      break-inside: avoid;
      margin-bottom: 1.5rem;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 1.5rem;
      box-shadow: var(--shadow);
      border: 3px solid #FFF;
      position: relative;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation: fadeInUp 0.6s ease forwards;
    }

    .card:hover {
      transform: translateY(-8px) rotate(1deg);
      box-shadow: 0 12px 25px rgba(255, 133, 161, 0.4);
    }

    /* 卡片頂部（名字與裝飾圖示） */
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.8rem;
      border-bottom: 2px dashed #FFE5EC;
      padding-bottom: 0.5rem;
    }

    .card-author {
      font-weight: 900;
      font-size: 1.1rem;
      color: var(--accent-color);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-badge {
      font-size: 1.2rem;
    }

    /* 留言內容 */
    .card-content {
      font-size: 0.98rem;
      line-height: 1.6;
      color: var(--text-main);
      white-space: pre-wrap; /* 保留換行 */
      word-break: break-word;
      margin-bottom: 1rem;
    }

    /* 時間標籤 */
    .card-time {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: right;
      font-weight: 700;
    }

    /* 漸進式出現動畫 */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 錯誤訊息提示區塊 */
    .error-msg {
      text-align: center;
      color: #FF6B6B;
      font-weight: 700;
      padding: 2rem;
      background: #FFF;
      border-radius: 15px;
      box-shadow: var(--shadow);
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>朋友對我的動態留言板</h1>
      <p class="subtitle">來看看大家留了什麼悄悄話給你吧！💖</p>
    </header>

    <!-- 載入中酷炫動畫 -->
    <div id="loading">
      <div class="loader-icon">💌</div>
      <div class="loading-text">讀取留言中...</div>
    </div>

    <!-- 錯誤訊息容器 -->
    <div id="error" class="error-msg"></div>

    <!-- 瀑布流留言牆 -->
    <main id="masonry-grid" class="masonry-grid"></main>
  </div>

  <script>
    // Google 試算表發布的 CSV 網址
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTTlEbOW3xJ4gHSs7-aZN2hzZd4M9kOC8YmnTfq8_tO1HGbGkSg5vFapieftbfzFb4YmymNMy70KTbB/pub?output=csv';

    // 可愛貼紙圖示，隨機指派給卡片
    const cuteBadges = ['🍓', '🌸', '🧸', '🐰', '🐾', '🎀', '🧋', '🐣', '🧁', '⭐'];

    document.addEventListener('DOMContentLoaded', () => {
      fetchMessages();
    });

    /**
     * 取得試算表 CSV 資料
     */
    async function fetchMessages() {
      const loadingEl = document.getElementById('loading');
      const gridEl = document.getElementById('masonry-grid');
      const errorEl = document.getElementById('error');

      try {
        const response = await fetch(CSV_URL);
        
        if (!response.ok) {
          throw new Error('網路回應不成功');
        }

        const csvText = await response.text();
        const messages = parseCSV(csvText);

        // 隱藏 Loading，顯示 Grid
        loadingEl.style.display = 'none';
        gridEl.style.display = 'block';

        renderCards(messages);

      } catch (error) {
        console.error('Fetch error:', error);
        loadingEl.style.display = 'none';
        errorEl.style.display = 'block';
        errorEl.innerHTML = '😿 載入留言失敗，請稍後再試一次！<br><small>' + error.message + '</small>';
      }
    }

    /**
     * 嚴謹解析 CSV 格式（支援留言內含有逗號與雙引號換行的情況）
     */
    function parseCSV(text) {
      const lines = [];
      let row = [];
      let entry = '';
      let insideQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (insideQuotes && nextChar === '"') {
            entry += '"'; // 處理 escape 的雙引號
            i++;
          } else {
            insideQuotes = !insideQuotes; // 切換引號狀態
          }
        } else if (char === ',' && !insideQuotes) {
          row.push(entry.trim());
          entry = '';
        } else if ((char === '\r' || char === '\n') && !insideQuotes) {
          if (char === '\r' && nextChar === '\n') {
            i++; // 處理 \r\n
          }
          row.push(entry.trim());
          if (row.length > 1 || row[0] !== '') {
            lines.push(row);
          }
          row = [];
          entry = '';
        } else {
          entry += char;
        }
      }

      if (entry || row.length > 0) {
        row.push(entry.trim());
        lines.push(row);
      }

      // 移除第一行（標題列：時間戳記、名字、悄悄話）
      if (lines.length > 0) {
        lines.shift();
      }

      // 轉換成物件陣列，並將最新的留言排在前面
      return lines
        .filter(r => r.length >= 2) // 確保至少有時間與名字/內容
        .map(row => ({
          timestamp: row[0] || '未知時間',
          name: row[1] || '匿名朋友',
          message: row[2] || '（這個人沒有留下悄悄話～）'
        }))
        .reverse();
    }

    /**
     * 動態渲染留言卡片到畫面上
     */
    function renderCards(messages) {
      const gridEl = document.getElementById('masonry-grid');

      if (messages.length === 0) {
        gridEl.innerHTML = '<div style="text-align:center; grid-column: 1/-1; color: var(--text-muted);">目前還沒有任何留言喔！</div>';
        return;
      }

      messages.forEach((item, index) => {
        // 隨機選一個可愛圖示
        const randomBadge = cuteBadges[Math.floor(Math.random() * cuteBadges.length)];
        
        // 建立卡片 DOM
        const card = document.createElement('div');
        card.className = 'card';
        // 增加漸進出現的交錯動畫時間
        card.style.animationDelay = `${index * 0.08}s`;

        card.innerHTML = `
          <div class="card-header">
            <span class="card-author">
              <span class="card-badge">${randomBadge}</span>
              ${escapeHTML(item.name)}
            </span>
          </div>
          <div class="card-content">${escapeHTML(item.message)}</div>
          <div class="card-time">${escapeHTML(item.timestamp)}</div>
        `;

        gridEl.appendChild(card);
      });
    }

    /**
     * 防止 XSS 攻擊的 HTML 轉義字元函式
     */
    function escapeHTML(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>

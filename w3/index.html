<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✨ 可愛迷因產生器 Meme Generator ✨</title>
  
  <!-- 引入日系可愛圓體 (Zen Maru Gothic) 與 Mochiy Pop One，讓視覺充滿童趣 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 用於把網頁上的 HTML 區塊轉成圖片以供下載 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    // 設定 Tailwind 的客製化主題配色與字體
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            kawaii: {
              pink: '#FFB7B2',
              softPink: '#FFF0F5',
              yellow: '#FFE5B4',
              mint: '#E2F0CB',
              purple: '#E1CEF5',
              lavender: '#D8B4F8',
              cardBg: '#FFFFFF',
              dark: '#5A4A42'
            }
          },
          fontFamily: {
            kawaii: ['"Zen Maru Gothic"', 'sans-serif'],
            title: ['"Mochiy Pop One"', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      background-color: #FFF0F5;
      background-image: radial-gradient(#FFD1DC 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      color: #5A4A42;
    }

    /* 迷因圖片上的文字經典黑邊粗體效果 */
    .meme-text {
      font-family: 'Mochiy Pop One', 'Zen Maru Gothic', sans-serif;
      text-transform: uppercase;
      word-wrap: break-word;
      user-select: none;
      /* 多重 text-shadow 創造高相容性的立體描邊效果 */
      text-shadow:
        3px 3px 0 var(--stroke-color, #000),
       -3px 3px 0 var(--stroke-color, #000),
        3px -3px 0 var(--stroke-color, #000),
       -3px -3px 0 var(--stroke-color, #000),
        0px 3px 0 var(--stroke-color, #000),
        0px -3px 0 var(--stroke-color, #000),
        3px 0px 0 var(--stroke-color, #000),
       -3px 0px 0 var(--stroke-color, #000);
    }

    /* 客製化可愛滑桿 (Range Input) 樣式 */
    input[type=range] {
      -webkit-appearance: none;
      background: #FFE5B4;
      height: 12px;
      border-radius: 6px;
      outline: none;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #FFB7B2;
      border: 3px solid #FFF;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
      transition: transform 0.1s ease;
    }

    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    /* 可愛點點與可愛按鈕彈跳效果 */
    .btn-bounce {
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .btn-bounce:hover {
      transform: translateY(-3px) scale(1.02);
    }
    .btn-bounce:active {
      transform: translateY(1px) scale(0.98);
    }

    /* 隱藏原生檔案上傳按鈕 */
    #file-input {
      display: none;
    }
  </style>
</head>
<body class="min-h-screen py-8 px-4 flex flex-col justify-between items-center">

  <header class="text-center mb-6">
    <div class="inline-block bg-white px-6 py-2 rounded-full shadow-md border-2 border-pink-200 mb-2">
      <span class="text-pink-400 font-bold tracking-wider text-sm">🐱 輕鬆做迷因 · 快樂每一天 🐾</span>
    </div>
    <h1 class="text-3xl md:text-5xl font-extrabold text-pink-500 font-title tracking-wide drop-shadow-sm flex items-center justify-center gap-2">
      <span>✨</span> 可愛迷因產生器 <span>✨</span>
    </h1>
  </header>

  <main class="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-12 gap-8 items-start mb-8">

    <!-- 👈 左側：控制面板區 (佔 5 欄) -->
    <section class="lg:col-span-5 bg-white p-6 rounded-3xl shadow-xl border-4 border-pink-100 flex flex-col gap-5">
      <h2 class="text-xl font-bold text-gray-700 pb-2 border-b-2 border-pink-100 flex items-center gap-2">
        <i class="fa-solid fa-sliders text-pink-400"></i> 控制面板 (Settings)
      </h2>

      <!-- 1. 圖片上傳區塊 -->
      <div class="flex flex-col gap-2">
        <label class="font-bold text-sm text-gray-600 flex items-center gap-1">
          <i class="fa-solid fa-image text-pink-400"></i> 選擇底圖 (Image)
        </label>
        <!-- 自訂可愛點擊上傳外觀 -->
        <label for="file-input" class="cursor-pointer border-2 border-dashed border-pink-300 hover:border-pink-400 bg-pink-50/50 hover:bg-pink-100/50 p-4 rounded-2xl text-center btn-bounce transition flex flex-col items-center justify-center gap-2 text-pink-500">
          <i class="fa-solid fa-cloud-arrow-up text-3xl"></i>
          <span class="font-bold text-sm">點擊或拖曳上傳圖片</span>
          <span class="text-xs text-gray-400">支援 JPG / PNG / GIF 格式</span>
        </label>
        <input type="file" id="file-input" accept="image/*">
      </div>

      <!-- 2. 文字輸入區塊 -->
      <div class="flex flex-col gap-3">
        <!-- 上方文字 -->
        <div>
          <label for="top-text-input" class="font-bold text-sm text-gray-600 mb-1 block">
            <i class="fa-solid fa-heading text-pink-400"></i> 上方文字 (Top Text)
          </label>
          <input type="text" id="top-text-input" value="當你寫的程式" placeholder="輸入上方文字..." 
                 class="w-full px-4 py-2 bg-pink-50/30 border-2 border-pink-200 rounded-xl focus:outline-none focus:border-pink-400 transition font-medium">
        </div>

        <!-- 下方文字 -->
        <div>
          <label for="bottom-text-input" class="font-bold text-sm text-gray-600 mb-1 block">
            <i class="fa-solid fa-align-bottom text-pink-400"></i> 下方文字 (Bottom Text)
          </label>
          <input type="text" id="bottom-text-input" value="第一次就直接 Run 成功" placeholder="輸入下方文字..." 
                 class="w-full px-4 py-2 bg-pink-50/30 border-2 border-pink-200 rounded-xl focus:outline-none focus:border-pink-400 transition font-medium">
        </div>
      </div>

      <!-- 3. 滑桿控制項 (字體大小 & 垂直位置) -->
      <div class="space-y-4 bg-yellow-50/50 p-4 rounded-2xl border border-yellow-200">
        <!-- 字體大小 -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label for="font-size-slider" class="text-xs font-bold text-gray-600">
              <i class="fa-solid fa-text-height text-yellow-500"></i> 字體大小 (Font Size)
            </label>
            <span id="font-size-val" class="text-xs font-bold bg-white px-2 py-0.5 rounded-full border border-yellow-300">36px</span>
          </div>
          <input type="range" id="font-size-slider" min="16" max="72" value="36" class="w-full">
        </div>

        <!-- 上方文字垂直位置 -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label for="top-pos-slider" class="text-xs font-bold text-gray-600">
              <i class="fa-solid fa-arrow-up-from-line text-yellow-500"></i> 上方文字位置
            </label>
            <span id="top-pos-val" class="text-xs font-bold bg-white px-2 py-0.5 rounded-full border border-yellow-300">5%</span>
          </div>
          <input type="range" id="top-pos-slider" min="0" max="80" value="5" class="w-full">
        </div>

        <!-- 下方文字垂直位置 -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label for="bottom-pos-slider" class="text-xs font-bold text-gray-600">
              <i class="fa-solid fa-arrow-down-from-line text-yellow-500"></i> 下方文字位置
            </label>
            <span id="bottom-pos-val" class="text-xs font-bold bg-white px-2 py-0.5 rounded-full border border-yellow-300">5%</span>
          </div>
          <input type="range" id="bottom-pos-slider" min="0" max="80" value="5" class="w-full">
        </div>
      </div>

      <!-- 4. 附加樣式調整 (文字顏色 & 邊框顏色) -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-bold text-gray-600 mb-1 block">文字顏色</label>
          <div class="flex items-center gap-2 bg-pink-50/50 p-2 rounded-xl border border-pink-200">
            <input type="color" id="text-color-picker" value="#ffffff" class="w-8 h-8 rounded cursor-pointer border-none bg-transparent">
            <span id="text-color-hex" class="text-xs font-mono font-bold text-gray-500">#FFFFFF</span>
          </div>
        </div>

        <div>
          <label class="text-xs font-bold text-gray-600 mb-1 block">文字描邊顏色</label>
          <div class="flex items-center gap-2 bg-pink-50/50 p-2 rounded-xl border border-pink-200">
            <input type="color" id="stroke-color-picker" value="#000000" class="w-8 h-8 rounded cursor-pointer border-none bg-transparent">
            <span id="stroke-color-hex" class="text-xs font-mono font-bold text-gray-500">#000000</span>
          </div>
        </div>
      </div>

      <!-- 5. 一鍵下載按鈕 -->
      <button id="download-btn" class="w-full mt-2 bg-gradient-to-r from-pink-400 to-purple-400 hover:from-pink-500 hover:to-purple-500 text-white font-bold py-3.5 px-6 rounded-2xl shadow-lg border-b-4 border-purple-600 btn-bounce flex items-center justify-center gap-2 text-lg">
        <i class="fa-solid fa-download"></i> 一鍵下載迷因圖檔
      </button>

    </section>


    <!-- 👉 右側：即時預覽區 (佔 7 欄) -->
    <section class="lg:col-span-7 flex flex-col items-center">
      <div class="w-full bg-white p-4 md:p-6 rounded-3xl shadow-xl border-4 border-pink-100 flex flex-col items-center">
        
        <div class="w-full flex justify-between items-center mb-4">
          <span class="font-bold text-gray-600 flex items-center gap-2 text-sm md:text-base">
            <i class="fa-solid fa-eye text-pink-400"></i> 即時預覽區 (Preview)
          </span>
          <span class="text-xs text-pink-400 bg-pink-50 px-3 py-1 rounded-full font-bold">✨ 所見即所得</span>
        </div>

        <!-- 📸 迷因畫布本體 (即將被截圖下載的目標 HTML 區塊) -->
        <div id="meme-canvas" class="relative overflow-hidden rounded-2xl shadow-inner bg-gray-100 max-w-full flex justify-center items-center select-none" style="min-height: 320px; max-height: 550px;">
          
          <!-- 迷因底圖 -->
          <img id="meme-image" src="https://placehold.co/600x600/FFB7B2/5A4A42?text=Upload+Your+Image+Here!+🐱" 
               alt="迷因底圖" class="w-full h-auto object-contain block max-h-[550px]"
               onerror="this.src='https://placehold.co/600x600/FFB7B2/5A4A42?text=Cute+Meme+Base';">

          <!-- 上方文字疊加層 -->
          <div id="meme-top-text" class="meme-text absolute left-0 right-0 px-4 text-center text-white leading-tight transition-all duration-75"
               style="top: 5%; font-size: 36px; color: #ffffff;">
            當你寫的程式
          </div>

          <!-- 下方文字疊加層 -->
          <div id="meme-bottom-text" class="meme-text absolute left-0 right-0 px-4 text-center text-white leading-tight transition-all duration-75"
               style="bottom: 5%; font-size: 36px; color: #ffffff;">
            第一次就直接 Run 成功
          </div>

        </div>

        <p class="text-xs text-gray-400 mt-4 text-center">
          💡 提示：可以在左邊切換喜歡的圖片，或是調整文字大小與位置喔！
        </p>

      </div>
    </section>

  </main>

  <footer class="text-center text-xs text-gray-400 py-4">
    <p>Made with ❤️ for Meme Lovers | 迷因產生器 CodePen 專用版本</p>
  </footer>


  <script>
    // ==========================================
    // 1. DOM 元素選取 (取得 HTML 中的控制元件)
    // ==========================================
    const fileInput = document.getElementById('file-input');
    const memeImage = document.getElementById('meme-image');
    const memeCanvas = document.getElementById('meme-canvas');

    // 文字輸入框
    const topTextInput = document.getElementById('top-text-input');
    const bottomTextInput = document.getElementById('bottom-text-input');

    // 文字顯示元素
    const memeTopText = document.getElementById('meme-top-text');
    const memeBottomText = document.getElementById('meme-bottom-text');

    // 控制滑桿與數值顯示標籤
    const fontSizeSlider = document.getElementById('font-size-slider');
    const fontSizeVal = document.getElementById('font-size-val');

    const topPosSlider = document.getElementById('top-pos-slider');
    const topPosVal = document.getElementById('top-pos-val');

    const bottomPosSlider = document.getElementById('bottom-pos-slider');
    const bottomPosVal = document.getElementById('bottom-pos-val');

    // 顏色選擇器
    const textColorPicker = document.getElementById('text-color-picker');
    const textColorHex = document.getElementById('text-color-hex');
    const strokeColorPicker = document.getElementById('stroke-color-picker');
    const strokeColorHex = document.getElementById('stroke-color-hex');

    // 下載按鈕
    const downloadBtn = document.getElementById('download-btn');


    // ==========================================
    // 2. 本機圖片上傳處理 (使用 FileReader 避開 CORS)
    // ==========================================
    fileInput.addEventListener('change', function(event) {
      const file = event.target.files[0];
      if (file) {
        // 建立 FileReader 讀取器物件
        const reader = new FileReader();

        // 當檔案讀取完成時觸發
        reader.onload = function(e) {
          // 將讀取到的 Data URL 設為 <img> 的圖片來源
          memeImage.src = e.target.result;
        };

        // 以 Data URL (base64) 格式讀取檔案
        reader.readAsDataURL(file);
      }
    });


    // ==========================================
    // 3. 文字即時同步顯示 (Live Update Text)
    // ==========================================
    // 監聽「上方文字」輸入事件
    topTextInput.addEventListener('input', function() {
      memeTopText.innerText = this.value;
    });

    // 監聽「下方文字」輸入事件
    bottomTextInput.addEventListener('input', function() {
      memeBottomText.innerText = this.value;
    });


    // ==========================================
    // 4. 滑桿參數即時微調 (Size & Positions)
    // ==========================================

    // 微調「字體大小」
    fontSizeSlider.addEventListener('input', function() {
      const size = this.value + 'px';
      memeTopText.style.fontSize = size;
      memeBottomText.style.fontSize = size;
      fontSizeVal.innerText = size;
    });

    // 微調「上方文字垂直位置 (Top %)」
    topPosSlider.addEventListener('input', function() {
      const pos = this.value + '%';
      memeTopText.style.top = pos;
      topPosVal.innerText = pos;
    });

    // 微調「下方文字垂直位置 (Bottom %)」
    bottomPosSlider.addEventListener('input', function() {
      const pos = this.value + '%';
      memeBottomText.style.bottom = pos;
      bottomPosVal.innerText = pos;
    });


    // ==========================================
    // 5. 文字與描邊顏色控制
    // ==========================================

    // 文字顏色
    textColorPicker.addEventListener('input', function() {
      const color = this.value;
      memeTopText.style.color = color;
      memeBottomText.style.color = color;
      textColorHex.innerText = color.toUpperCase();
    });

    // 描邊顏色 (透過修改 CSS 變數)
    strokeColorPicker.addEventListener('input', function() {
      const color = this.value;
      memeTopText.style.setProperty('--stroke-color', color);
      memeBottomText.style.setProperty('--stroke-color', color);
      strokeColorHex.innerText = color.toUpperCase();
    });


    // ==========================================
    // 6. 一鍵下載圖檔 (使用 html2canvas)
    // ==========================================
    downloadBtn.addEventListener('click', function() {
      // 更改按鈕狀態為處理中，提升使用者體驗
      const originalBtnHTML = downloadBtn.innerHTML;
      downloadBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> 圖片生成中...`;
      downloadBtn.disabled = true;

      // 使用 html2canvas 將 #meme-canvas 區塊繪製為 Canvas
      html2canvas(memeCanvas, {
        scale: 2, // 提高畫質解析度 (2倍)
        useCORS: true, // 允許跨域圖片處理
        allowTaint: true,
        backgroundColor: null // 保持背景透明度
      }).then(canvas => {
        // 將 Canvas 轉為 Base64 圖片連結
        const imageUrl = canvas.toDataURL('image/png');

        // 建立虛擬 <a> 標籤觸發下載
        const downloadLink = document.createElement('a');
        downloadLink.href = imageUrl;
        downloadLink.download = 'my-meme.png'; // 預設下載檔名

        // 模擬點擊下載
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);

        // 恢復按鈕原本樣式
        downloadBtn.innerHTML = originalBtnHTML;
        downloadBtn.disabled = false;
      }).catch(err => {
        console.error('截圖下載失敗：', err);
        alert('截圖失敗，請稍後再試！');
        downloadBtn.innerHTML = originalBtnHTML;
        downloadBtn.disabled = false;
      });
    });
  </script>
</body>
</html>
